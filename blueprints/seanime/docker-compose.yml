services:
  seanime-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes:
      - ../files/seanime-config:/mnt/config
      - ../files/anime:/mnt/anime
      - ../files/downloads:/mnt/downloads
    command:
      [ "sh", "-c", "chown -R 1000:1000 /mnt/config && find /mnt/config -type d -exec chmod 755 {} + && find /mnt/config -type f -exec chmod 644 {} +",]

  seanime:
    image: umagistr/seanime:v3.6.1-rootless
    depends_on:
      seanime-init:
        condition: service_completed_successfully
    environment:
      - SEANIME_SERVER_HOST=0.0.0.0
    expose: 
      - "43211"
    volumes:
      - ../files/seanime-config:/home/seanime/.config/Seanime
      - ../files/anime:/anime
      - ../files/downloads:/downloads
    restart: unless-stopped
