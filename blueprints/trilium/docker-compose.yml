services:
  trilium:
    image: zadam/trilium:latest
    expose:
      - 8080
    restart: always
    volumes:
      # The notes database lives in trilium-data; the original template kept
      # only the backups (in the host's /root/trilium-backups).
      - trilium-data:/home/node/trilium-data

volumes:
  trilium-data:
