services:
  cloudcmd:
    image: coderaiser/cloudcmd:18.5.1
    expose:
      - "8000"
    environment:
      - CLOUDCMD_ROOT=/mnt/fs
      - CLOUDCMD_AUTH=true
      - CLOUDCMD_USERNAME=${USERNAME}
      - CLOUDCMD_PASSWORD=${PASSWORD}
    volumes:
      # Read-only: a writable / lets the container change any host file,
      # including root's SSH keys. Use ../files/... for a writable share.
      - /:/mnt/fs:ro
